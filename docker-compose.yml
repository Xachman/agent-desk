services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: agent-desk-app
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - database:/var/www/html/database
      - storage:/var/www/html/storage
      - ./docker/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
      - xdebug-log:/var/log
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - KUBERNETES_ENABLED=false
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
    depends_on:
      - mailpit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-desk

  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: agent-desk-queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=1200"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - database:/var/www/html/database
      - storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - KUBERNETES_ENABLED=false
    depends_on:
      - app
    networks:
      - agent-desk

  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: agent-desk-vite
    command: ["npm", "run", "dev", "--", "--host"]
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - VITE_APP_NAME=AgentDesk
    networks:
      - agent-desk

  mailpit:
    image: axllent/mailpit:latest
    container_name: agent-desk-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - agent-desk

volumes:
  vendor:
  node_modules:
  database:
  storage:
  xdebug-log:

networks:
  agent-desk:
    driver: bridge
